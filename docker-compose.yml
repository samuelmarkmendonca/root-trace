services:
  db:
    container_name: db
    build:
      context: ./demo
      dockerfile: db/Dockerfile
    ports:
      - "8003:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=db

  checkout:
    container_name: checkout
    build:
      context: ./demo
      dockerfile: checkout/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=checkout
      - DB_URL=http://db:8000
    depends_on:
      - db

  frontend:
    container_name: frontend
    build:
      context: ./demo
      dockerfile: frontend/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=frontend
      - CHECKOUT_URL=http://checkout:8000
    depends_on:
      - checkout
