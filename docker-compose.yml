x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    container_name: db
    build:
      context: ./demo
      dockerfile: db/Dockerfile
    ports:
      - "8003:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=db
    logging: *default-logging

  checkout:
    container_name: checkout
    build:
      context: ./demo
      dockerfile: checkout/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=checkout
      - DB_URL=http://db:8000
    mem_limit: 128m
    depends_on:
      - db
    logging: *default-logging

  frontend:
    container_name: frontend
    build:
      context: ./demo
      dockerfile: frontend/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=frontend
      - CHECKOUT_URL=http://checkout:8000
    depends_on:
      - checkout
    logging: *default-logging

  loadgen:
    container_name: loadgen
    build:
      context: ./demo
      dockerfile: loadgen/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=http://frontend:8000
    depends_on:
      - frontend
    logging: *default-logging

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - frontend
      - checkout
      - db
    logging: *default-logging
