x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    container_name: db
    build:
      context: ./demo
      dockerfile: db/Dockerfile
    ports:
      - "8003:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=db
    logging: *default-logging

  checkout:
    container_name: checkout
    build:
      context: ./demo
      dockerfile: checkout/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=checkout
      - DB_URL=http://db:8000
    mem_limit: 128m
    depends_on:
      - db
    logging: *default-logging

  frontend:
    container_name: frontend
    build:
      context: ./demo
      dockerfile: frontend/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_NAME=frontend
      - CHECKOUT_URL=http://checkout:8000
    depends_on:
      - checkout
    logging: *default-logging

  loadgen:
    container_name: loadgen
    build:
      context: ./demo
      dockerfile: loadgen/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=http://frontend:8000
    depends_on:
      - frontend
    logging: *default-logging

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - frontend
      - checkout
      - db
    logging: *default-logging

  loki:
    container_name: loki
    image: grafana/loki:3.2.1
    ports:
      - "3100:3100"
    logging: *default-logging

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.5.1
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *default-logging

  investigator:
    container_name: investigator
    build:
      context: ./investigator
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - DEPLOYS_FILE=/data/deploys.json
      - LLM_URL=${LLM_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b-8k}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/deploys.json:/data/deploys.json:ro
    depends_on:
      - prometheus
      - loki
    logging: *default-logging
